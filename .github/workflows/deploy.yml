name: Deploy — BioFeedbackLoop

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-biofeedbackloop
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # required for Workload Identity Federation

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Authenticate to Google Cloud ─────────────────────────────────────────
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: github-actions@botridge.iam.gserviceaccount.com

      # ── Node setup ───────────────────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      # ── Install root deps (Next.js build) ────────────────────────────────────
      - name: Install root dependencies
        run: npm ci

      # ── Build Next.js static export ─────────────────────────────────────────
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: botridge.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: botridge
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: botridge.firebasestorage.app
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
          NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID }}
          NEXT_PUBLIC_USE_EMULATOR: "false"

      # ── Install Functions deps ───────────────────────────────────────────────
      - name: Install Functions dependencies
        working-directory: functions
        run: npm ci

      # ── Compile Cloud Functions ──────────────────────────────────────────────
      - name: Build Cloud Functions
        working-directory: functions
        run: npm run build

      # ── Deploy (scoped — never touches other botridge targets) ───────────────
      - name: Deploy to Firebase
        run: |
          npx firebase-tools deploy \
            --only hosting:biofeedbackloop,functions:biofeedbackloop \
            --project botridge \
            --non-interactive
